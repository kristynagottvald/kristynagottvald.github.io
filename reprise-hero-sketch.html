const ASPECT = 1884 / 658;

function fitW() {
  return min(windowWidth, windowHeight * ASPECT);
}

function setup() {
  createCanvas(fitW(), fitW() / ASPECT);
  LOGO_PATHS = LOGO_SVG.map((d) => new Path2D(d));
  frameRate(60);
}

function windowResized() {
  resizeCanvas(fitW(), fitW() / ASPECT);
}

function clamp01(v) {
  return constrain(v, 0, 1);
}

function eo(v) {
  return 1 - pow(1 - clamp01(v), 3);
}

function eio(v) {
  v = clamp01(v);
  return v < 0.5 ? 4 * v * v * v : 1 - pow(-2 * v + 2, 3) / 2;
}

function font(fam, size, bold) {
  textFont(fam);
  textSize(size);
  textStyle(bold ? BOLD : NORMAL);
}

function tx(s, x, y, size, col, fam, bold, h, v) {
  noStroke();
  fill(col);
  font(fam || SANS, size, bold);
  textAlign(h || LEFT, v || CENTER);
  text(s, x, y);
}

function entrance(delay) {
  return eo(((millis() - t0) / 1000 - delay) / 0.85);
}

function pointerAt(t) {
  for (let i = 0; i < POINTER_PATH.length - 1; i++) {
    const a = POINTER_PATH[i], b = POINTER_PATH[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const k = b[0] === a[0] ? 1 : eio((t - a[0]) / (b[0] - a[0]));
      return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
    }
  }
  return [756, 610];
}

function draw() {
  syncSize();
  const t = ((millis() - t0) / 1000) % LOOP;
  const sent = t >= 4.6 && t < 20.65;
  const sentAmt = t < 20.2 ? clamp01((t - 4.9) / 0.4) : 1 - clamp01((t - 20.2) / 0.4);
  const onAmt = t < 19.3 ? clamp01((t - 7.4) / 0.35) : 1 - clamp01((t - 19.3) / 0.35);
  const panelAmt = t < 19.3 ? eo((t - 7.4) / 0.7) : 1 - eo((t - 19.3) / 0.7);
  const dt = deltaTime / 1000;

  for (let i = 0; i < 3; i++) {
    const s = 9.8 + i * 2.7;
    const hot = t >= s + 1.0 && t < s + 2.7;
    hotA[i] = constrain(hotA[i] + (hot ? 1 : -1) * dt / 0.3, 0, 1);
  }

  background(NAVY);
  push();
  scale(width / 1884);
  drawingContext.beginPath();
  drawingContext.rect(0, 0, 1884, 658);
  drawingContext.clip();
  noStroke();
  fill(NAVY);
  rect(0, 0, 1884, 658);
  drawBlue(t);
  drawLogoBox();
  drawScreen(t, onAmt);
  push();
  translate(250, 200);
  scale(0.85);
  translate(-68, -190);
  drawPrompt(t, sent, sentAmt);
  pop();
  push();
  translate(250, 292);
  scale(0.85);
  translate(-68, -294);
  drawStep(t);
  pop();
  push();
  translate(1309, 190);
  scale(0.95);
  translate(-68, -502);
  drawFound(t, panelAmt);
  pop();
  drawPointer(t);
  pop();
}

function drawBlue(t) {
  noStroke();
  fill(BLUE);
  rect(0, 96, 1197, 562);
  push();
  drawingContext.beginPath();
  drawingContext.rect(0, 96, 1197, 562);
  drawingContext.clip();
  translate(789, 393);
  rotate((millis() - t0) / 1000 / 240 * TWO_PI);
  strokeWeight(1);
  for (let i = 0; i < 64; i++) {
    const a = i * TWO_PI / 64 + 0.05;
    const k = 0.575 + 0.325 * sin((millis() - t0) / 1000 * TWO_PI / 5.5 - i * 0.37 * TWO_PI / 5.5);
    stroke(200, 225, 255, 255 * 0.5 * k);
    line(0, 0, cos(a) * 1500, sin(a) * 1500);
  }
  pop();
}

function drawLogoBox() {
  const e = entrance(0.1);
  push();
  translate(0, (1 - e) * 20);
  drawingContext.globalAlpha = e;
  noStroke();
  fill(LOGO_BG);
  rect(1197, 0, 687, 96);
  push();
  translate(1453, 25.5);
  scale(0.98);
  drawingContext.fillStyle = CREAM;
  for (let i = 0; i < LOGO_PATHS.length; i++) {
    drawingContext.fill(LOGO_PATHS[i], i === 0 ? "evenodd" : "nonzero");
  }
  pop();
  drawingContext.globalAlpha = 1;
  pop();
}

function drawScreen(t, onAmt) {
  push();
  translate(421, 252);
  scale(0.97);
  drawingContext.beginPath();
  drawingContext.roundRect(0, 0, 1020, 606, [18, 18, 18, 18]);
  drawingContext.clip();

  noStroke();
  fill(255);
  rect(0, 0, 1020, 606);

  fill("#f5f7fc");
  rect(0, 0, 166, 606);
  fill(UI_LINE);
  rect(165, 0, 1, 606);
  fill(HL);
  rect(18, 18, 26, 26, 7);
  fill("#d9dbe4");
  rect(54, 26, 62, 9, 5);
  const navW = [70, 44, 62, 52, 38];
  for (let i = 0; i < 5; i++) {
    const y = 68 + i * 38;
    if (i === 0) {
      fill("#dbe6f8");
      rect(14, y, 138, 32, 8);
      fill(47, 111, 207, 140);
    } else fill("#cfd3e2");
    rect(26, y + 11.5, navW[i], 9, 5);
  }

  fill(255);
  rect(166, 0, 854, 46);
  fill(UI_LINE);
  rect(166, 44, 854, 2);
  fill("#d9dbe4");
  rect(179, 18.5, 130, 9, 5);
  rect(894, 18.5, 70, 9, 5);
  fill("#e1e3ea");
  circle(989, 23, 26);

  const bw = 2 * (1 - onAmt);
  const bc = color(228, 231, 240, 255 * (1 - onAmt));
  const stat = [["12,480", 68], ["34", 56], ["96%", 62]];
  for (let i = 0; i < 3; i++) {
    const b = BOXES[i];
    drawCard(b, bw, bc);
    fill("#e1e3ea");
    noStroke();
    rect(b.x + 24, b.y + 22, stat[i][1], 7, 4);
    tx(stat[i][0], b.x + 24, b.y + 56, 30, NAVY, SERIF, false, LEFT, TOP);
  }

  drawCard(BOXES[3], bw, bc);
  drawCard(BOXES[4], bw, bc);

  fill("#e3ebf9");
  noStroke();
  rect(214, 222, 118, 22, 11);
  rect(629, 222, 104, 22, 11);

  const bx = 218, bwid = 335, area = 278, gap = 9;
  const barW = (bwid - gap * 9) / 10;
  for (let i = 0; i < 10; i++) {
    const h = BARS[i] * 0.86 / 100 * area;
    if (i === 7) fill(lerpColor(color(HL), color("#1a4fa0"), hotA[1]));
    else fill("#c1cde8");
    rect(bx + i * (barW + gap), 196 + 394 - 30 - h, barW, h, 3, 3, 0, 0);
  }

  for (let i = 0; i < 3; i++) {
    const y = 272 + i * 72;
    fill(i < 2 ? "#e5483f" : "#3b78d8");
    circle(633 + 5.5, y + 36, 11);
    tx(ALERTS[i], 660, y + 36, 23, "#7b8096");
    if (i < 2) {
      fill("#eef0f5");
      rect(633, y + 70, 335, 2);
    }
  }

  drawAnts(t, onAmt);
  drawTags();
  drawingContext.setLineDash([]);
  pop();
}

function drawCard(b, bw, bc) {
  fill(255);
  stroke(bc);
  strokeWeight(max(bw, 0.001));
  rect(b.x + bw / 2, b.y + bw / 2, b.w - bw, b.h - bw, 10);
}

function drawAnts(t, onAmt) {
  if (onAmt <= 0) return;
  const off = t < 19.3 ? 0 : clamp01((t - 19.3) / 0.5);
  const offset = -((millis() - t0) / 1000) * 23.6;
  for (const b of BOXES) {
    const op = clamp01((t - 7.4 - b.g * 0.25) / 0.5) * (1 - off);
    if (op <= 0) continue;
    const h = hotA[b.g];
    push();
    drawingContext.setLineDash([7, 6]);
    drawingContext.lineDashOffset = offset;
    strokeCap(ROUND);
    stroke(47, 111, 207, 255 * op);
    strokeWeight(3.2 + 0.6 * h);
    fill(47, 111, 207, 255 * 0.07 * h * op);
    rect(b.x + 1.6, b.y + 1.6, b.w - 3.2, b.h - 3.2, 9);
    drawingContext.setLineDash([]);
    pop();
  }
}

function drawTags() {
  for (let g = 0; g < 3; g++) {
    const a = hotA[g];
    if (a <= 0.01) continue;
    font(MONO, 20, false);
    const tg = TAGS[g];
    const w = textWidth(tg.t) + 32;
    const x = tg.x;
    const y = tg.y + (1 - a) * 4;
    noStroke();
    fill(47, 111, 207, 255 * a);
    rect(x, y, w, 42, 7);
    tx(tg.t, x + 16, y + 21.5, 20, color(255, 255, 255, 255 * a), MONO);
  }
}

function drawPrompt(t, sent, sentAmt) {
  const e = entrance(0.45);
  const w = lerp(604, 556, sentAmt);
  const x = 68, y = 190 + (1 - e) * 20, h = 92;
  push();
  drawingContext.globalAlpha = e;
  const bg = lerpColor(color(CREAM), color(15, 15, 66, 235), sentAmt);
  fill(bg);
  stroke(96, 150, 240, 204);
  strokeWeight(1.5);
  rect(x, y, w, h, 10, 10, 0, 10);
  noStroke();

  let n = 0;
  if (t >= 4.6 && t < 20.2) n = PROMPT.length;
  else if (t >= 0.7 && t < 4.6) n = constrain(floor((t - 0.7) / 0.0558), 0, PROMPT.length);
  const typed = PROMPT.substring(0, n);
  const col = lerpColor(color(NAVY), color(CREAM), sentAmt);
  tx(typed, x + 36, y + h / 2 - 1, 23, col, SANS);
  if (!sent && sentAmt === 0 && floor(t) % 2 === 0) {
    font(SANS, 23, false);
    fill(HL);
    rect(x + 36 + textWidth(typed) + 2, y + h / 2 - 17, 2, 30);
  }

  const showBtn = t < 4.77 || t >= 20.65;
  if (showBtn) {
    const hot = t >= 4.6 && t < 4.77;
    const bx = x + 604 - 20 - 48, by = y + (h - 48) / 2;
    push();
    translate(bx + 24, by + 24);
    if (hot) scale(1.08);
    fill(hot ? "#7aa2f5" : "#dbe6f8");
    rect(-24, -24, 48, 48, 7);
    stroke(NAVY);
    strokeWeight(2);
    strokeCap(ROUND);
    strokeJoin(ROUND);
    noFill();
    line(-9, 0, 9, 0);
    line(2, -7, 9, 0);
    line(2, 7, 9, 0);
    pop();
  }
  drawingContext.globalAlpha = 1;
  pop();
}

function drawStep(t) {
  if (t < 4.82 || t >= 7.9) return;
  const a = t < 7.4 ? clamp01((t - 4.82) / 0.35) : 1 - clamp01((t - 7.4) / 0.35);
  const slide = (1 - eo((t - 4.82) / 0.45)) * -6;
  const done = t >= 6.32;
  const x = 68, y = 294 + slide, w = 556, h = 60;
  push();
  drawingContext.globalAlpha = a;
  drawingContext.shadowColor = "rgba(4,6,40,0.16)";
  drawingContext.shadowBlur = 18;
  drawingContext.shadowOffsetY = 6;
  fill(NAVY);
  stroke(96, 150, 240, 204);
  strokeWeight(1.5);
  rect(x, y, w, h, 9);
  drawingContext.shadowColor = "transparent";
  drawingContext.shadowBlur = 0;
  drawingContext.shadowOffsetY = 0;

  const cx = x + 12 + 16 + 1.5, cy = y + h / 2;
  if (done) {
    const k = constrain((t - 6.32) / 0.4, 0, 1);
    const sc = k < 1 ? 0.4 + 0.6 * (1 + 1.5 * pow(k - 1, 3) + 0.5 * pow(k - 1, 2)) * 1 : 1;
    push();
    translate(cx, cy);
    scale(constrain(sc, 0.4, 1.12));
    noStroke();
    fill("#5f9f66");
    circle(0, 0, 32);
    scale(1.22);
    stroke(255);
    strokeWeight(2.4);
    strokeCap(ROUND);
    strokeJoin(ROUND);
    noFill();
    line(-5, 0.5, -1.4, 4.1);
    line(-1.4, 4.1, 5.2, -3.4);
    pop();
  } else {
    noFill();
    strokeWeight(3);
    stroke(255, 255, 255, 46);
    circle(cx, cy, 30);
    stroke("#8db6f5");
    const a0 = ((millis() - t0) / 1000) * TWO_PI / 0.8;
    arc(cx, cy, 30, 30, a0, a0 + HALF_PI);
  }

  noStroke();
  const tx0 = x + 12 + 32 + 14 + 1.5;
  const mid = "#9a9dc4";
  font(MONO, 18, false);
  const first = "reprise.";
  const fn = done ? "get_data" : "review_demo";
  fill(mid);
  textAlign(LEFT, CENTER);
  text(first, tx0, cy + 1);
  const w1 = textWidth(first);
  fill(CREAM);
  textStyle(BOLD);
  text(fn, tx0 + w1, cy + 1);
  const w2 = textWidth(fn);
  fill(mid);
  textStyle(NORMAL);
  text("()", tx0 + w1 + w2, cy + 1);
  font(MONO, 17, false);
  fill(mid);
  textAlign(RIGHT, CENTER);
  text(done ? "13 sources" : "reviewing", x + w - 24, cy + 1);
  drawingContext.globalAlpha = 1;
  pop();
}

function drawFound(t, a) {
  if (a <= 0.001) return;
  const x = 68, y = 502 + (1 - a) * 26;
  push();
  drawingContext.globalAlpha = a;
  noStroke();
  fill(PALE);
  rect(x, y, 343, 341, 8);

  try {
    drawingContext.letterSpacing = "1.96px";
  } catch (e) {}
  tx("FOUND ON THIS SCREEN", x + 26, y + 32.5, 14, NAVY, SANS, false);
  try {
    drawingContext.letterSpacing = "0px";
  } catch (e) {}

  const tot = round(13 * eo((t - 7.4) / 1.3));
  font(SERIF, 68, false);
  const nw = textWidth(str(tot));
  tx(str(tot), x + 26, y + 109, 68, NAVY, SERIF, false, LEFT, BASELINE);
  tx("fields you can change", x + 26 + max(nw, 60) + 20, y + 109, 19, NAVY, SANS, false, LEFT, BASELINE);

  for (let i = 0; i < 3; i++) {
    const ry = y + 185 + i * 44;
    noStroke();
    if (hotA[i] > 0.01) {
      fill(255, 255, 255, 255 * 0.6 * hotA[i]);
      rect(x + 16, ry, 311, 44, 6);
    }
    fill(15, 15, 66, 36);
    rect(x + 16, ry, 311, 1);
    tx(ROWS[i][0], x + 26, ry + 23, 18, NAVY, SANS, false);
    tx(ROWS[i][1], x + 343 - 26, ry + 23, 18, NAVY, SANS, true, RIGHT);
  }
  drawingContext.globalAlpha = 1;
  pop();
}

function drawPointer(t) {
  const p = pointerAt(t);
  const e = constrain(entrance(0.5), 0, 1);
  if (t >= 4.6 && t < 5.3) {
    const k = (t - 4.6) / 0.7;
    noFill();
    stroke(122, 162, 245, 255 * (0.9 * (1 - k)));
    strokeWeight(2);
    circle(p[0], p[1], 12 * (0.4 + 3.2 * k));
  }
  push();
  translate(p[0], p[1]);
  scale(0.8);
  let s = 1;
  if (t >= 4.5 && t < 4.9) s = 1 - 0.08 * sin((t - 4.5) / 0.4 * PI);
  scale(s);
  fill(255);
  stroke(NAVY);
  strokeWeight(2);
  strokeJoin(ROUND);
  beginShape();
  vertex(2, 2);
  vertex(21, 11.5);
  vertex(12.8, 14.1);
  vertex(10, 23.5);
  endShape(CLOSE);
  pop();
}
