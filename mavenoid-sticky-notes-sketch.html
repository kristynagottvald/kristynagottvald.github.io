<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavenoid sticky-note wave</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
// Mavenoid sticky-note wave

// Load Figtree (OpenProcessing doesn't ship it)
const fontLink = document.createElement('link');
fontLink.rel = 'stylesheet';
fontLink.href = 'https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&display=swap';
// Canvas text doesn't trigger web-font downloads on its own, so request it explicitly,
// once the stylesheet has loaded (before that, fonts.load() has nothing to load)
const fontReady = new Promise((resolve) => {
  fontLink.onload = () => document.fonts.load('500 18px Figtree').then(resolve, resolve);
  fontLink.onerror = resolve;
});
document.head.appendChild(fontLink);

const colors = [
  { name: "Yellow",      hex: "#F9E898", ink: "#0B346D", line: "#0B346D" },
  { name: "Orange",      hex: "#F96442", ink: "#FFFFFF", line: "#0B346D" },
  { name: "Medium Blue", hex: "#3A7ED4", ink: "#FFFFFF", line: "#0B346D" },
  { name: "Sky Blue",    hex: "#78BFF4", ink: "#0B346D", line: "#0B346D" },
  { name: "Light Blue",  hex: "#CDEBFE", ink: "#3A7ED4", line: "#3A7ED4" },
  { name: "Navy",        hex: "#0B346D", ink: "#FFFFFF", line: "#FFFFFF" }
];
const BG = '#FFFFFF';

let notes = [];
let cols, rows;
const noteWidth = 240;
const noteHeight = 180;
const paddingX = 25;
const paddingY = 25;
const offsetX = -100;
const offsetY = -20;

// Stickies render 25% smaller on narrow (mobile) widths
let noteScale = 1;
const MOBILE_MAX_WIDTH = 700;   // matches the site's mobile breakpoint

// Timing is based on real elapsed time, so the wave keeps its pace even if frames drop
const STEP_MS = 125;            // one wave step (higher = slower wave; was 100)
const POP_MS = 1000 / 60 / 0.04;// pop duration (was 0.04 progress per frame at 60fps)
let waveIndex = 0;
let stepTimer = 0;
let lastTime = null;            // null = first frame or just resumed

// Each color is drawn once into a cached image, then stamped every frame
const SPRITE_PAD = 4;
const SPRITE_DENSITY = 3;       // sharp even at the 1.5x pop scale
let sprites = [];
let ready = false;

function setup() {
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  createCanvas(windowWidth, windowHeight);
  buildSprites();
  initGrid();
  ready = true;
  fontReady.then(() => buildSprites());   // rebuild once Figtree has loaded

  // Pause while the sketch is scrolled out of view or the tab is hidden
  new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) { lastTime = null; loop(); } else noLoop();
  }).observe(document.body);
}

function buildSprites() {
  sprites.forEach((g) => g.remove());
  sprites = colors.map((s) => {
    const g = createGraphics(noteWidth + SPRITE_PAD * 2, noteHeight + SPRITE_PAD * 2);
    g.pixelDensity(SPRITE_DENSITY);
    g.clear();
    drawNote(g, s, noteWidth, noteHeight);
    return g;
  });
}

function initGrid() {
  notes = [];
  noteScale = width <= MOBILE_MAX_WIDTH ? 0.75 : 1;
  const k = noteScale;
  cols = Math.ceil(width / ((noteWidth + paddingX) * k)) + 2;
  rows = Math.ceil(height / ((noteHeight + paddingY) * k)) + 2;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      let x = (offsetX + i * (noteWidth + paddingX)) * k;
      let y = (offsetY + j * (noteHeight + paddingY)) * k;
      notes.push(new StickyNote(i, j, x, y, noteWidth, noteHeight));
    }
  }
}

function draw() {
  background(BG);
  if (!ready) return;

  // Real elapsed time, so a slow frame never slows the wave down (it catches up instead).
  // Gaps over 250ms (tab switch, resume) are treated as one normal frame.
  const now = millis();
  let dt = lastTime === null ? 0 : now - lastTime;
  lastTime = now;
  if (dt > 250) dt = 1000 / 60;

  stepTimer += dt;
  while (stepTimer >= STEP_MS) {
    stepTimer -= STEP_MS;
    for (let note of notes) {
      if (note.col + note.row === waveIndex) note.triggerPop();
    }
    waveIndex++;
    if (waveIndex > cols + rows + 15) waveIndex = 0;
  }

  // Two passes so popping notes render on top of static ones
  for (let note of notes) {
    if (!note.isPopping) { note.update(dt); note.display(); }
  }
  for (let note of notes) {
    if (note.isPopping) { note.update(dt); note.display(); }
  }
}

// Polygon with rounded corners (radius r: a number, or one radius per point), drawn onto g
function roundedPoly(g, pts, radii) {
  const n = pts.length;
  let r = 2;
  const at = (p, q) => {
    const dx = q[0] - p[0], dy = q[1] - p[1];
    const len = Math.hypot(dx, dy);
    const k = Math.min(r, len / 2) / len;
    return [p[0] + dx * k, p[1] + dy * k];
  };
  g.beginShape();
  for (let i = 0; i < n; i++) {
    r = Array.isArray(radii) ? radii[i] : radii;
    const prev = pts[(i + n - 1) % n], cur = pts[i], next = pts[(i + 1) % n];
    const a = at(cur, prev), b = at(cur, next);
    // Sample the quadratic curve a -> cur -> b with plain vertices
    // (quadraticVertex was removed in p5 2.x, so avoid it)
    for (let t = 0; t <= 1.0001; t += 0.25) {
      const u = 1 - t;
      g.vertex(
        u * u * a[0] + 2 * u * t * cur[0] + t * t * b[0],
        u * u * a[1] + 2 * u * t * cur[1] + t * t * b[1]
      );
    }
  }
  g.endShape(CLOSE);
}

// One sticky note, drawn onto graphics g
function drawNote(g, s, w, h) {
  const foldSize = 20;
  g.push();
  g.translate(SPRITE_PAD, SPRITE_PAD);

  g.stroke(s.line);
  g.strokeWeight(2.5);
  g.strokeJoin(MITER);
  g.fill(s.hex);

  roundedPoly(g, [
    [0, 0], [w, 0], [w, h - foldSize],
    [w - foldSize, h], [0, h]
  ], [4, 4, 2, 2, 4]);   // top-left, top-right, bottom-left = 4px; fold corners stay 2px

  // Folded corner
  g.fill(0, 0, 0, 40);
  roundedPoly(g, [
    [w - foldSize, h], [w, h - foldSize],
    [w - foldSize, h - foldSize]
  ], 2);

  g.fill(s.ink);
  g.noStroke();
  g.textSize(18);
  g.textFont('Figtree');
  g.textStyle(NORMAL);
  g.textLeading(22);
  g.textAlign(LEFT, TOP);
  g.text(s.name + "\n" + s.hex, 12, 15);
  g.pop();
}

class StickyNote {
  constructor(col, row, x, y, w, h) {
    this.col = col; this.row = row;
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.colorIndex = 0;
    this.scale = 1.0;
    this.isPopping = false;
    this.popProgress = 0;
  }

  triggerPop() {
    if (!this.isPopping) {
      this.isPopping = true;
      this.popProgress = 0;
      this.colorIndex = (this.colorIndex + 1) % colors.length;
    }
  }

  update(dt) {
    if (this.isPopping) {
      this.popProgress += dt / POP_MS;
      if (this.popProgress >= 1) {
        this.popProgress = 1;
        this.isPopping = false;
      }
      this.scale = 1.0 + Math.sin(this.popProgress * Math.PI) * 0.5;
    } else {
      this.scale = 1.0;
    }
  }

  display() {
    const img = sprites[this.colorIndex];
    if (!this.isPopping) {
      // Resting notes: a plain stamp, no transform state
      image(img, this.x - SPRITE_PAD * noteScale, this.y - SPRITE_PAD * noteScale,
            img.width * noteScale, img.height * noteScale);
      return;
    }
    push();
    translate(this.x + this.w * noteScale / 2, this.y + this.h * noteScale / 2);
    scale(this.scale * noteScale);
    rotate(Math.sin(this.popProgress * Math.PI) * 0.08);
    image(img, -this.w / 2 - SPRITE_PAD, -this.h / 2 - SPRITE_PAD);
    pop();
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initGrid();
  waveIndex = 0;
  stepTimer = 0;
  lastTime = null;
}
</script>
</body>
</html>
