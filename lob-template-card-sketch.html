function addInter() {
  return new Promise((resolve) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:ital,wght@1,400&display=swap';
    link.onload = () => {
      if (!document.fonts) return resolve();
      Promise.all([document.fonts.load('500 32px Inter', 'Abc'), document.fonts.load('700 32px Inter', 'Abc'), document.fonts.load('italic 400 32px "EB Garamond"', 'Abc')]).then(resolve, resolve);
    };
    link.onerror = resolve;
    document.head.appendChild(link);
    setTimeout(resolve, 4000);
  });
}

function tryImage(src) {
  return new Promise((resolve) => loadImage(src, resolve, () => resolve(null)));
}

async function setup() {
  createCanvas(W, H);
  await addInter();
  LOGO = await tryImage(LOGO_SRC);
  PHOTO = await tryImage(PHOTO_SRC);
  if (document.fonts && document.fonts.check('500 32px Inter')) P5_FONT = 'Inter';
  startMs = millis();
  ready = true;
}

function ease(x) {
  x = constrain(x, 0, 1);
  return 1 - pow(1 - x, 3);
}

function easeIO(x) {
  x = constrain(x, 0, 1);
  return x < 0.5 ? 4 * x * x * x : 1 - pow(-2 * x + 2, 3) / 2;
}

function popIn(x) {
  x = constrain(x, 0, 1);
  if (x <= 0) return 0;
  const c1 = 1.70158;
  return 1 + (c1 + 1) * pow(x - 1, 3) + c1 * pow(x - 1, 2);
}

function span(t, a, b) {
  return constrain((t - a) / (b - a), 0, 1);
}

function setAlpha(a) {
  drawingContext.globalAlpha = constrain(a, 0, 1);
}

function setBlur(px) {
  drawingContext.filter = px > 0.2 ? 'blur(' + (px * pixelDensity()).toFixed(1) + 'px)' : 'none';
}

function rr(x, y, w, h, r) {
  const ctx = drawingContext;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, max(0, min(r, w / 2, h / 2)));
  else ctx.rect(x, y, w, h);
}

function hatch(x, y, w, h, col, gap, lw) {
  const ctx = drawingContext;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.strokeStyle = col;
  ctx.lineWidth = lw || 6;
  ctx.beginPath();
  for (let d = -h; d < w; d += gap) {
    ctx.moveTo(x + d, y + h);
    ctx.lineTo(x + d + h, y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawEl(i, t) {
  const ctx = drawingContext;
  const grow = popIn((t - 0.5 - i * 0.08) / 0.35);
  const fade = 1 - easeIO(span(t, 4.6, 5.1));
  if (grow <= 0 || fade <= 0) return;
  const u1 = easeIO(span(t, 1.3 + i * 0.12, 2.1 + i * 0.12));
  const u2 = easeIO(span(t, 3.0 + i * 0.12, 3.8 + i * 0.12));
  const a = POSES[0][i];
  const b = POSES[1][i];
  const c = POSES[2][i];
  const v = [];
  for (let k = 0; k < 4; k++) v.push(lerp(lerp(a[k], b[k], u1), c[k], u2));
  const hop = sin(PI * u1) + sin(PI * u2);
  const rot = (sin(PI * u1) - sin(PI * u2)) * 0.05 * (i % 2 ? 1 : -1);
  const cx = v[0] + v[2] / 2;
  const cy = v[1] + v[3] / 2 - hop * 24;
  ctx.save();
  setAlpha(fade);
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(grow * (0.92 + 0.08 * fade), grow * (0.92 + 0.08 * fade));
  ctx.fillStyle = YEL;
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = SW;
  ctx.beginPath();
  ctx.rect(-v[2] / 2, -v[3] / 2, v[2], v[3]);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  setAlpha(1);
}

function drawPhoto(t) {
  const ctx = drawingContext;
  const e = ease(span(t, 5.5, 6.3));
  if (e <= 0) return;
  const px = 608;
  const py = 516;
  const pw = 349;
  const ph = 346;
  ctx.save();
  setAlpha(e);
  ctx.beginPath();
  ctx.rect(px, py, pw, ph);
  ctx.clip();
  const z = 1.1 - 0.1 * e;
  ctx.translate(px + pw / 2, py + ph / 2);
  ctx.scale(z, z);
  ctx.translate(-(px + pw / 2), -(py + ph / 2));
  if (PHOTO) {
    const k = max(pw / PHOTO.width, ph / PHOTO.height);
    const iw = PHOTO.width * k;
    const ih = PHOTO.height * k;
    ctx.drawImage(PHOTO.canvas, px + (pw - iw) / 2, py + (ph - ih) / 2, iw, ih);
  } else {
    ctx.fillStyle = '#c8b9a4';
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#e6dfd2';
    ctx.fillRect(px, py, 120, 150);
    ctx.fillStyle = '#9b8264';
    ctx.fillRect(px + 250, py, 100, 240);
    ctx.fillStyle = '#8a6a48';
    ctx.beginPath();
    ctx.ellipse(px + 300, py + 90, 60, 80, 0, 0, TWO_PI);
    ctx.fill();
    ctx.fillStyle = '#e9e4da';
    ctx.fillRect(px + 200, py + 300, 150, 46);
    ctx.fillStyle = '#aebfd4';
    ctx.beginPath();
    ctx.ellipse(px + 182, py + 330, 140, 105, 0, PI, TWO_PI);
    ctx.fill();
    ctx.fillRect(px + 42, py + 330, 280, 20);
    ctx.fillStyle = '#f4f4f4';
    ctx.beginPath();
    ctx.moveTo(px + 150, py + 248);
    ctx.lineTo(px + 214, py + 248);
    ctx.lineTo(px + 182, py + 346);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7a4a30';
    ctx.fillRect(px + 166, py + 215, 32, 40);
    ctx.beginPath();
    ctx.ellipse(px + 182, py + 168, 38, 48, 0, 0, TWO_PI);
    ctx.fill();
    ctx.fillStyle = '#2a1a14';
    ctx.beginPath();
    ctx.ellipse(px + 182, py + 118, 54, 40, 0, 0, TWO_PI);
    ctx.fill();
    ctx.fillStyle = '#e07a3a';
    ctx.beginPath();
    ctx.ellipse(px + 182, py + 128, 52, 14, 0, 0, TWO_PI);
    ctx.fill();
    ctx.strokeStyle = '#f2e9e2';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(px + 166, py + 168, 13, 0, TWO_PI);
    ctx.arc(px + 198, py + 168, 13, 0, TWO_PI);
    ctx.stroke();
    ctx.fillStyle = '#e0503c';
    ctx.save();
    ctx.translate(px + 196, py + 262);
    ctx.rotate(-0.15);
    rr(-18, -32, 36, 64, 6);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#7a4a30';
    ctx.beginPath();
    ctx.ellipse(px + 182, py + 292, 24, 12, 0, 0, TWO_PI);
    ctx.fill();
  }
  setAlpha(1);
  ctx.restore();
}

function drawQR(t) {
  const ctx = drawingContext;
  const s = popIn((t - 8.1) / 0.4);
  if (s <= 0) return;
  ctx.save();
  ctx.translate(880.5, 926.5);
  ctx.scale(s * 0.9, s * 0.9);
  ctx.fillStyle = WHITE;
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 2.2;
  ctx.fillRect(-41.5, -41.5, 83, 83);
  ctx.strokeRect(-41.5, -41.5, 83, 83);
  ctx.translate(-39.5, -40);
  ctx.fillStyle = BLUE;
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 3;
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'miter';
  const br = (x, y, dx, dy) => {
    ctx.beginPath();
    ctx.moveTo(x + dx * 10, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + dy * 10);
    ctx.stroke();
  };
  br(15.5, 15.5, 1, 1);
  br(62.5, 15.5, -1, 1);
  br(15.5, 64.5, 1, -1);
  br(62.5, 64.5, -1, -1);
  ctx.lineWidth = 2.5;
  ctx.strokeRect(24, 24, 12.5, 12.5);
  ctx.strokeRect(43, 24, 12.5, 12.5);
  ctx.strokeRect(24, 43, 12.5, 12.5);
  ctx.fillRect(42, 42, 5, 5);
  ctx.fillRect(47, 47, 10, 5);
  ctx.fillRect(52, 52, 5, 5);
  ctx.fillRect(42, 52, 5, 5);
  ctx.restore();
}

function drawDesign(t) {
  const ctx = drawingContext;
  t = t < 5.2 ? t : 5.2 + (t - 5.2) * 1.4;
  const ew = easeIO(span(t, 5.2, 5.9));
  if (ew > 0) {
    ctx.fillStyle = BLUE;
    ctx.fillRect(243, 516, 365 * ew, 480);
  }
  drawPhoto(t);

  const ts = popIn((t - 6.0) / 0.4);
  if (ts > 0) {
    ctx.save();
    ctx.translate(330, 583);
    ctx.scale(ts, ts);
    ctx.fillStyle = YEL;
    ctx.fillRect(-47, -28, 94, 56);
    ctx.fillStyle = BLUE;
    ctx.font = '700 24px ' + P5_FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('// co', -25, 1);
    ctx.restore();
  }

  ctx.fillStyle = WHITE;
  for (let k = 0; k < 3; k++) {
    const g = easeIO(span(t, 6.3 + k * 0.15, 6.8 + k * 0.15));
    if (g <= 0) continue;
    ctx.save();
    ctx.shadowColor = 'rgba(30, 20, 170, 0.45)';
    ctx.shadowBlur = 36;
    ctx.shadowOffsetY = 16;
    rr(304, 689 + k * 27, (k === 2 ? 176 : 228) * g, 15, 7.5);
    ctx.fill();
    ctx.restore();
  }

  for (let k = 0; k < 3; k++) {
    const y = 850 + k * 36;
    const pc = popIn((t - 6.9 - k * 0.25) / 0.35);
    if (pc > 0) {
      ctx.save();
      ctx.translate(312, y);
      ctx.scale(pc, pc);
      ctx.fillStyle = WHITE;
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, TWO_PI);
      ctx.fill();
      ctx.strokeStyle = BLUE;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(-1.5, 3.5);
      ctx.lineTo(5, -3.5);
      ctx.stroke();
      ctx.restore();
    }
    const g = easeIO(span(t, 7.0 + k * 0.25, 7.5 + k * 0.25));
    if (g > 0) {
      ctx.fillStyle = SOFT;
      rr(343, y - 8, CHECKS[k] * g, 16, 8);
      ctx.fill();
    }
  }

  ctx.fillStyle = BLUE;
  const g1 = easeIO(span(t, 7.7, 8.2));
  const g2 = easeIO(span(t, 7.85, 8.35));
  if (g1 > 0) {
    rr(655, 908, 152 * g1, 14, 7);
    ctx.fill();
  }
  if (g2 > 0) {
    rr(655, 935, 118 * g2, 14, 7);
    ctx.fill();
  }
  drawQR(t);
}

function panelOff(t) {
  return (1 - easeIO(span(t, 10.0, 11.3))) * 760 + easeIO(span(t, 13.2, 13.7)) * 760;
}

function drawCard(t) {
  const ctx = drawingContext;
  const grow = popIn(t / 0.5);
  const u = easeIO(span(t, 10.6, 11.8));
  const sc = grow * lerp(1, SLOT.w / 714, u);
  if (sc <= 0.001) return;
  const tx = lerp(600, SLOT.x + SLOT.w / 2, u);
  const ty = lerp(756, SLOT.y + SLOT.h / 2 + panelOff(t), u);
  const d = easeIO(span(t, 4.7, 5.3));
  const wire = 1 - d;
  const radius = lerp(6, 16, d);
  const cardX = lerp(CARD.x, 243, d);
  const cardY = lerp(CARD.y, 516, d);
  const cardW = lerp(CARD.w, 714, d);
  const cardH = lerp(CARD.h, 480, d);
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(sc, sc);
  ctx.translate(-600, -756);
  setAlpha(1 - ease(span(t, 10.6, 11.4)));
  rr(cardX + 32, cardY + 32, cardW, cardH, radius);
  ctx.fillStyle = SHADOW;
  ctx.fill();
  setAlpha(1);
  rr(cardX, cardY, cardW, cardH, radius);
  ctx.fillStyle = YEL;
  ctx.fill();
  ctx.save();
  rr(cardX, cardY, cardW, cardH, radius);
  ctx.clip();
  if (wire > 0) {
    setAlpha(wire);
    hatch(656, 510, 314, 252, BLUE, 27);
    setAlpha(1);
  }
  drawDesign(t);
  ctx.restore();
  if (wire > 0) {
    setAlpha(wire);
    rr(cardX, cardY, cardW, cardH, radius);
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = SW;
    ctx.stroke();
    setAlpha(1);
  }
  for (const i of EL_ORDER) drawEl(i, t);
  ctx.restore();
}

function drawThumb(tpl, cx, cy) {
  const ctx = drawingContext;
  const lay = LAYOUT[tpl.L];
  const k = 0.363;
  const w = lay.w * k;
  const h = lay.h * k;
  const x = cx - w / 2;
  const y = cy - h / 2;
  const lw = 1.6;
  ctx.save();
  rr(x, y, w, h, 1.5);
  ctx.fillStyle = tpl.bg;
  ctx.fill();
  ctx.save();
  rr(x, y, w, h, 1.5);
  ctx.clip();
  ctx.strokeStyle = tpl.st;
  ctx.fillStyle = tpl.st;
  ctx.lineWidth = lw;
  for (const e of lay.el) {
    const ex = x + e[1] * w;
    const ey = y + e[2] * h;
    const ew = e[3] * w;
    const eh = e[4] * h;
    if (e[0] === 'b') ctx.strokeRect(ex, ey, ew, eh);
    else if (e[0] === 'x') {
      if (tpl.solid) ctx.fillRect(ex, ey, ew, eh);
      else ctx.strokeRect(ex, ey, ew, eh);
    } else if (e[0] === 'f') ctx.fillRect(ex, ey, ew, eh);
    else if (e[0] === 's') {
      if (tpl.soft) {
        ctx.fillStyle = tpl.soft;
        ctx.fillRect(ex, ey, ew, eh);
        ctx.fillStyle = tpl.st;
      }
    } else if (e[0] === 'h') hatch(ex, ey, ew, eh, tpl.st, w * 0.036, 1.1);
    else if (e[0] === 'l') {
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex + ew, ey);
      ctx.stroke();
    }
  }
  ctx.restore();
  rr(x, y, w, h, 1.5);
  ctx.strokeStyle = tpl.st;
  ctx.lineWidth = lw;
  ctx.stroke();
  ctx.restore();
}

function drawGallery(t) {
  const off = panelOff(t);
  if (off >= 759) return;
  const ctx = drawingContext;
  ctx.save();
  ctx.translate(0, off);
  ctx.save();
  ctx.shadowColor = 'rgba(40, 10, 70, 0.25)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = -6;
  rr(81, 474, 1040, 900, 14);
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.restore();
  rr(81, 474, 1040, 900, 14);
  ctx.clip();
  ctx.fillStyle = NAVY;
  ctx.fillRect(81, 474, 1040, 264);
  ctx.fillStyle = '#2f3868';
  for (let gx = 684; gx < 1121; gx += 14.5) {
    for (let gy = 482; gy < 738; gy += 14.5) {
      ctx.beginPath();
      ctx.arc(gx, gy, 1.1, 0, TWO_PI);
      ctx.fill();
    }
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(81, 474, 1040, 264);
  ctx.clip();
  ctx.strokeStyle = '#3a2fd8';
  ctx.lineWidth = 2.5;
  rr(812, 420, 213, 98, 8);
  ctx.stroke();
  rr(1043, 420, 120, 168, 8);
  ctx.stroke();
  rr(1043, 604, 120, 168, 8);
  ctx.stroke();
  rr(812, 692, 213, 80, 8);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = WHITE;
  ctx.font = '500 24px ' + P5_FONT;
  ctx.letterSpacing = '3px';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('TEMPLATE GALLERY', 201, 574);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = NAVY_BAR;
  rr(201, 622, 316, 14, 7);
  ctx.fill();
  rr(201, 654, 269, 14, 7);
  ctx.fill();
  for (let n = 0; n < GALLERY.length; n++) {
    const g = GALLERY[n];
    const x0 = GCOL[n % 4];
    const y0 = GROW[floor(n / 4)];
    ctx.save();
    ctx.shadowColor = 'rgba(30, 20, 60, 0.10)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 10;
    rr(x0, y0, 219, 158, 8);
    ctx.fillStyle = '#f7f6f8';
    ctx.fill();
    ctx.restore();
    rr(x0, y0, 219, 158, 8);
    ctx.strokeStyle = '#e8e6ec';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    drawThumb(g.tpl, x0 + 109.5, y0 + 79);
    ctx.fillStyle = '#16161d';
    ctx.font = '500 14px ' + P5_FONT;
    ctx.textAlign = 'left';
    ctx.fillText(g.name, x0, y0 + 178);
    ctx.fillStyle = '#8c8a96';
    ctx.font = '400 12.5px ' + P5_FONT;
    const iw = ctx.measureText(g.industry).width;
    ctx.fillText(g.industry, x0, y0 + 199);
    ctx.fillRect(x0 + iw + 9, y0 + 192, 1, 13);
    ctx.fillText(g.cat, x0 + iw + 19, y0 + 199);
  }
  ctx.restore();
}

function textLine(label, cx, y, t, tIn, tOut, font) {
  const ctx = drawingContext;
  const e = ease((t - tIn) / 0.45);
  const o = ease((t - tOut) / 0.4);
  if (e <= 0 || o >= 1) return;
  setAlpha(e * (1 - o));
  setBlur((1 - e) * 6 + o * 6);
  ctx.font = font;
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.fillText(label, cx, y + (1 - e) * 18 - o * 20);
  setBlur(0);
  setAlpha(1);
}

function drawCopy(t) {
  const ctx = drawingContext;
  ctx.save();
  ctx.textBaseline = 'middle';
  const sans = '500 64px ' + P5_FONT;
  const serif = 'italic 400 74px "EB Garamond", Georgia, serif';
  textLine('Spend less time building', 600, 250, t, 0.3, 4.6, sans);
  textLine('and more time sending', 600, 250, t, 4.9, 9.4, sans);
  textLine('Explore the Lob', 600, 216, t, 9.7, 13.2, sans);
  textLine('Template Gallery', 600, 300, t, 9.85, 13.2, serif);
  ctx.restore();
}

function drawLogo(t) {
  const e = popIn((t - 13.75) / 0.45);
  if (e <= 0) return;
  const ctx = drawingContext;
  if (LOGO) {
    const w = 200 * e;
    const h = (w * LOGO.height) / LOGO.width;
    ctx.drawImage(LOGO.canvas, 600 - w / 2, 600 - h / 2, w, h);
  } else {
    ctx.save();
    ctx.translate(600, 600);
    ctx.scale(e, e);
    ctx.fillStyle = WHITE;
    ctx.font = '700 120px ' + P5_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Lob', 0, 0);
    ctx.restore();
  }
}

// the 720 x 720 canvas is scaled to fill its square frame
const MARGIN = 0;   // square frame: the canvas fills it
let szSeen = '';
function fitFrame() {
  const key = innerWidth + 'x' + innerHeight;
  if (key === szSeen || innerWidth <= 0 || innerHeight <= 0) return;
  szSeen = key;
  const s = Math.min(innerHeight * (1 - 2 * MARGIN), innerWidth) / W;
  const el = drawingContext.canvas;
  el.style.width = Math.floor(W * s) + 'px';
  el.style.height = Math.floor(H * s) + 'px';
}
function windowResized() { szSeen = ''; fitFrame(); }
window.addEventListener('message', (e) => { if (e.data === 'reset') startMs = millis(); });

function draw() {
  fitFrame();
  if (!ready) return;
  const t = ((millis() - startMs) / 1000) % TOTAL;
  background(lerpColor(color(BG), color(LOGO_BG), ease(span(t, 13.3, 13.8))));
  const ctx = drawingContext;
  ctx.save();
  ctx.scale(S, S);
  drawGallery(t);
  drawCard(t);
  drawCopy(t);
  drawLogo(t);
  setAlpha(1);
  setBlur(0);
  ctx.restore();
}
</script>
