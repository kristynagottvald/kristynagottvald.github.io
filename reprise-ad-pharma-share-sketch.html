<style>
:root{--matte:#cfe0f7;--navy:#0f0f42;--blue:#1f5fb4;--logo:#5aa0e6;--cream:#fbf9f4;--pale:#bbdcff;--frame:#dbe8f9;--sky:#7aa2f5;--hl:#2f6fcf;--line:#e4e7f0;--green:#5f9f66;--red:#e5483f;--amber:#3b78d8;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--matte);overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:880px;height:880px;background:var(--matte);transform:translate(-50%,-50%) scale(var(--s,1))}
#stage{position:absolute;inset:0;transform:scale(.73);overflow:hidden;background:var(--blue);color:var(--navy);font-family:'Inter Tight',system-ui,sans-serif}
.abs{position:absolute}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.go .rv{opacity:1;transform:none}

#rays{position:absolute;inset:0;width:880px;height:880px}
#rays g{transform-origin:480px 560px;animation:turn 240s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
#rays line{stroke:rgba(200,225,255,.5);stroke-width:1;animation:ray 5.5s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
@keyframes ray{0%,100%{opacity:.25}50%{opacity:.9}}

.navy{background:var(--navy)}
.logo{left:147px;top:95px;width:293px;height:103px;background:var(--logo);display:grid;place-items:center;z-index:3;border-radius:12px 0 12px 0}
.logo svg{width:195px;height:auto;display:block;fill:var(--cream)}

.win{left:267px;top:285px;width:613px;height:461px;background:var(--frame);border-radius:14px 0 0 14px;z-index:4}
.win h4{position:absolute;left:16px;top:0;height:53px;margin:0;display:flex;align-items:center;font-size:22px;font-weight:500;letter-spacing:-.01em}
.app{position:absolute;left:8px;top:53px;width:605px;height:394px;overflow:hidden;border-radius:8px 0 0 8px;background:#fff}
.ui{position:absolute;left:0;top:0;width:900px;height:585px;transform-origin:0 0;transform:scale(.6728);background:#fff}
.ui aside{position:absolute;left:0;top:0;width:150px;height:585px;background:#f5f7fc;border-right:1px solid var(--line);padding:18px 14px}
.ui u{display:block;height:9px;border-radius:5px;background:#d9dbe4;text-decoration:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 2px 24px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--hl);flex:none}
.nv{display:flex;align-items:center;height:32px;padding:0 12px;margin-bottom:6px;border-radius:8px}
.nv u{background:#cfd3e2}
.nv.act{background:#dbe6f8}.nv.act u{background:rgba(47,111,207,.55)}
.top{position:absolute;left:150px;right:0;top:0;height:46px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 16px}
.av{width:26px;height:26px;border-radius:50%;background:#e1e3ea;display:block}
.stat{position:absolute;top:62px;height:98px;width:228px;border:2px solid var(--line);border-radius:10px;padding:20px 22px;background:#fff}
.stat u{height:7px;background:#e1e3ea}
.stat b{display:block;font:400 34px/1 'Roboto Serif',Georgia,serif;letter-spacing:-.02em;margin-top:16px;font-variant-numeric:tabular-nums}
.card{position:absolute;left:166px;top:180px;width:718px;height:282px;border:2px solid var(--line);border-radius:10px;background:#fff}
.pill{position:absolute;left:22px;top:20px;width:118px;height:22px;border-radius:999px;background:#e3ebf9}
.cols{position:absolute;left:22px;right:22px;top:64px;height:10px}
.cols u{position:absolute;top:0;height:8px;background:#e1e3ea}
.row{position:absolute;left:22px;right:22px;height:58px;border-bottom:2px solid #eef0f5;display:flex;align-items:center;font-size:21px;color:#4a4e68;letter-spacing:-.005em}
.row:last-child{border-bottom:none}
.nm,.win h4{transition:opacity .22s ease}
.row u{position:absolute;height:9px;background:#d3d6e2}
.row u.s{background:#e6e8ee;height:9px}


.prompt{left:56px;top:640px;width:var(--pw,470px);height:170px;z-index:7;display:flex;align-items:flex-end;padding:0 20px 24px 28px;background:var(--cream);border:1.5px solid rgba(96,150,240,.8);border-radius:10px 10px 0 10px;color:var(--navy);font-size:23px;line-height:31px;letter-spacing:-.01em;white-space:nowrap;transition:opacity .8s ease var(--d,0s),transform .9s cubic-bezier(.2,.8,.2,1) var(--d,0s),background .35s,color .35s,width .4s cubic-bezier(.2,.8,.2,1)}
.prompt .txt{flex:1;margin-right:22px;position:relative;top:-1px}
.prompt .txt div{min-height:31px}
.caret{display:inline-block;width:2px;height:30px;background:var(--hl);margin-left:2px;vertical-align:-6px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.send{margin-bottom:7px;width:48px;height:48px;border-radius:7px;background:#dbe6f8;display:grid;place-items:center;flex:none}
.send svg{width:19px;height:19px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send.gone{display:none}
.prompt.nocaret .caret{display:none}
.prompt.sent{width:var(--sw,414px);padding-right:36px;background:rgba(15,15,66,.92);color:var(--cream)}
.prompt.sent .txt{margin-right:0}

.found{left:476px;top:574px;width:360px;height:236px;z-index:8;background:var(--pale);border-radius:8px;padding:26px 26px 0;color:var(--navy);opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.on .found{opacity:1;transform:none}
.found .lab{font:500 14px 'Inter Tight',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.found h3{margin:16px 0 22px;font:400 31px/1 'Roboto Serif',Georgia,serif;letter-spacing:-.02em}
.link{display:flex;align-items:center;gap:9px;height:54px;padding:0 8px 0 14px;background:rgba(255,255,255,.7);border-radius:8px}
.link svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link code{font:400 12.5px 'JetBrains Mono',monospace;color:var(--navy);flex:1;white-space:nowrap}
.copy{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;width:98px;padding:0 10px;border-radius:6px;background:var(--hl);color:#fff;font-size:15px;font-weight:500;transition:background .25s,transform .2s}
.copy svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:none}
.copy.done{background:var(--green)}
.copy.done svg{display:block}
.copy.press{transform:scale(.94)}
.found p{margin:16px 0 0;font-size:16px;color:rgba(15,15,66,.72);letter-spacing:-.005em}

.chip{left:910px;top:574px;z-index:9;height:38px;padding:0 12px 0 14px;display:flex;align-items:center;gap:14px;background:var(--cream);border:1.5px solid #3a6db4;border-radius:9px;font:400 13px 'JetBrains Mono',monospace;color:var(--navy);white-space:nowrap;opacity:0;pointer-events:none;transition:left .9s cubic-bezier(.45,0,.2,1),top .9s cubic-bezier(.45,0,.2,1),opacity .3s,transform .3s,box-shadow .3s,background .35s,color .35s,border-color .35s}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chip.sent{background:var(--navy);color:var(--cream);border-color:rgba(96,150,240,.8)}
.chip.carry{transform:rotate(-3deg) scale(1.05);box-shadow:0 10px 24px rgba(4,6,40,.3)}
.chip.nt{transition:none}
.ptr{position:absolute;left:560px;top:742px;z-index:12;pointer-events:none;transition:left .9s cubic-bezier(.45,0,.2,1),top .9s cubic-bezier(.45,0,.2,1)}
.rip{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--sky);opacity:0}
.rip.go{animation:rp .7s ease-out}
@keyframes rp{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(3.6)}}
@media (prefers-reduced-motion:reduce){#rays g,#rays line,.caret,.ld,.ld{animation:none}.rv,.found{transition:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const wrap=$('#wrap'),stage=$('#stage');
function fit(){wrap.style.setProperty('--s',Math.min(innerWidth/880,innerHeight/880))}
addEventListener('resize',fit);fit();

const rg=$('#rg');
for(let i=0;i<64;i++){
 const a=i*Math.PI*2/64+.05,l=document.createElementNS('http://www.w3.org/2000/svg','line');
 l.setAttribute('x1',480);l.setAttribute('y1',560);l.setAttribute('x2',480+Math.cos(a)*1500);l.setAttribute('y2',560+Math.sin(a)*1500);
 l.style.setProperty('--i',i);rg.appendChild(l);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ptr=$('#ptr'),rip=$('#rip');
const move=(x,y)=>{ptr.style.left=x+'px';ptr.style.top=y+'px'};
const chip=$('#chip');
const CHIP_HOME=[84,666];
const moveCarry=(x,y)=>{move(x,y);chip.style.left=(x-30)+'px';chip.style.top=(y-38)+'px'};
function jump(x,y){
 ptr.style.transition='none';chip.classList.add('nt');
 ptr.style.left=x+'px';ptr.style.top=y+'px';chip.style.left=(x-30)+'px';chip.style.top=(y-38)+'px';
 void ptr.offsetWidth;ptr.style.transition='';chip.classList.remove('nt');
}
const click=()=>{rip.classList.remove('go');void rip.offsetWidth;rip.classList.add('go')};
function center(el){
 const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect(),k=s.width/880;
 return [(r.left+r.width/2-s.left)/k,(r.top+r.height/2-s.top)/k];
}
function countTo(el,to,dur){
 if(reduce){el.textContent=to;return}
 const t0=performance.now(),f=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)};
 requestAnimationFrame(f);
}

const L1='Use my premade Pharma dataset',L2='and give me the link to share';
const N1=L1.length,TOT=N1+1+L2.length;
function render(n){
 const a=L1.slice(0,Math.min(n,N1)),b=n>N1?L2.slice(0,n-N1-1):'';
 const c='<i class="caret"></i>';
 $('#ptxt').innerHTML='<div>'+a+(n<=N1?c:'')+'</div><div>'+b+(n>N1?c:'')+'</div>';
}
async function type(){
 render(0);
 if(reduce){render(TOT);return}
 for(let n=1;n<=TOT;n++){render(n);await sleep(n===N1+1?260:46+Math.random()*30)}
}
function sizePrompt(){
 const c=document.createElement('canvas').getContext('2d');
 c.font='400 23px "Inter Tight",system-ui,sans-serif';
 const w=Math.max(c.measureText(L1).width,c.measureText(L2).width)+6;
 stage.style.setProperty('--pw',Math.round(28+w+22+48+20)+'px');
 stage.style.setProperty('--sw',Math.round(28+w+36)+'px');
}
async function setData(pharma){
 const els=$$('.nm');
 els.forEach(e=>e.style.opacity=0);$('#wtitle').style.opacity=0;
 await sleep(240);
 els.forEach(e=>{e.textContent=pharma?e.dataset.b:e.dataset.a;e.style.opacity=1});
 $('#wtitle').textContent=pharma?'Pharma demo':'Sales demo';$('#wtitle').style.opacity=1;
}
function copyState(done){
 $('#copy').classList.toggle('done',done);
 $('#ctx').textContent=done?'Copied':'Copy';
}

async function loop(){
 await sleep(1500);
 while(true){
  jump(900,560);
  chip.classList.add('carry');chip.style.opacity=1;
  await sleep(120);
  moveCarry(CHIP_HOME[0]+30,CHIP_HOME[1]+38);await sleep(1050);
  chip.classList.remove('carry');
  await sleep(350);
  move(560,742);await sleep(700);
  await type();
  await sleep(500);
  const [sx,sy]=center($('#send'));
  move(sx+6,sy+14);await sleep(1000);
  $('#send').classList.add('hot');$('#prompt').classList.add('nocaret');click();await sleep(170);
  $('#send').classList.add('gone');await sleep(110);
  $('#prompt').classList.add('sent');chip.classList.add('sent');
  await sleep(700);setData(true);
  await sleep(900);
  stage.classList.add('on');
  move(600,704);
  await sleep(2400);
  const [cx,cy]=center($('#copy'));
  move(cx+6,cy+12);await sleep(1000);
  $('#copy').classList.add('press');click();await sleep(160);
  $('#copy').classList.remove('press');copyState(true);
  await sleep(2600);
  move(560,742);await sleep(1200);
  stage.classList.remove('on');
  await sleep(900);
  copyState(false);
  chip.style.opacity=0;
  $('#prompt').classList.remove('sent');
  setTimeout(()=>chip.classList.remove('sent'),400);
  setData(false);
  render(0);
  await sleep(480);
  $('#send').classList.remove('gone','hot');$('#prompt').classList.remove('nocaret');
  await sleep(500);
 }
}

let started=false;
function start(){if(started)return;started=true;sizePrompt();render(0);document.body.classList.add('go');loop()}
document.fonts.ready.then(()=>{requestAnimationFrame(start);setTimeout(start,150)});
</script>
</body>
